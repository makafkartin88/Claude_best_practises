<!doctype html>
<html><head><meta charset="utf-8"><title>Weights</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--white); font-family: var(--font-display); }
  .row { display: grid; grid-template-columns: 120px 1fr 80px; gap: 16px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--bg-30); }
  .row:last-child { border: 0; }
  .w-name { font: 400 12px/1 var(--font-mono); color: var(--fg-subtle); }
  .sample { font-size: 26px; letter-spacing: -0.01em; color: var(--fg); }
  .n { font: 400 12px/1 var(--font-mono); color: var(--fg-subtle); text-align: right; }
</style></head>
<body>
  <div class="row"><span class="w-name">Light</span>     <span class="sample" style="font-weight:300">Aa Bb 012 — Logio</span><span class="n">300</span></div>
  <div class="row"><span class="w-name">Regular</span>   <span class="sample" style="font-weight:400">Aa Bb 012 — Logio</span><span class="n">400</span></div>
  <div class="row"><span class="w-name">Medium</span>    <span class="sample" style="font-weight:500">Aa Bb 012 — Logio</span><span class="n">500</span></div>
  <div class="row"><span class="w-name">SemiBold</span>  <span class="sample" style="font-weight:600">Aa Bb 012 — Logio</span><span class="n">600</span></div>
  <div class="row"><span class="w-name">Bold</span>      <span class="sample" style="font-weight:700">Aa Bb 012 — Logio</span><span class="n">700</span></div>
  <div class="row"><span class="w-name">ExtraBold</span> <span class="sample" style="font-weight:800">Aa Bb 012 — Logio</span><span class="n">800</span></div>
</body></html>
