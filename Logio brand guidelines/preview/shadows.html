<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px; background: var(--bg-20); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 100%; height: 72px; background: var(--white); border-radius: 10px; }
  .name { font: 500 11px/1 var(--font-mono); color: var(--fg); }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="name">xs</span></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="name">sm</span></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="name">md</span></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="name">lg</span></div>
    <div class="cell"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="name">xl</span></div>
  </div>
</body></html>
