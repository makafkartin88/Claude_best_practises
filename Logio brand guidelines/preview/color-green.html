<!doctype html>
<html><head><meta charset="utf-8"><title>Primary Green</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--white); }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; }
  .swatch { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; font: 500 10px/1.2 var(--font-label); }
  .step { opacity: 0.75; }
  .hex { font: 400 10px/1.2 var(--font-mono); opacity: 0.7; margin-top: 2px; }
  h4 { font: 600 14px/1 var(--font-display); margin: 0 0 14px; color: var(--fg); }
</style></head>
<body>
  <h4>Logio Green — primary</h4>
  <div class="row">
    <div class="swatch" style="background:#F2FEC9;color:#2B3D0C"><div class="step">10</div><div class="hex">F2FEC9</div></div>
    <div class="swatch" style="background:#E3FE98;color:#2B3D0C"><div class="step">20</div><div class="hex">E3FE98</div></div>
    <div class="swatch" style="background:#CDF95D;color:#2B3D0C"><div class="step">30</div><div class="hex">CDF95D</div></div>
    <div class="swatch" style="background:#B6EF2C;color:#2B3D0C"><div class="step">40</div><div class="hex">B6EF2C</div></div>
    <div class="swatch" style="background:#97D50D;color:#2B3D0C"><div class="step">50</div><div class="hex">97D50D</div></div>
    <div class="swatch" style="background:#7FBA06;color:#fff;outline:2px solid rgba(0,0,0,0.12);outline-offset:-2px"><div class="step">60 ★</div><div class="hex">7FBA06</div></div>
    <div class="swatch" style="background:#58810A;color:#fff"><div class="step">70</div><div class="hex">58810A</div></div>
    <div class="swatch" style="background:#48660E;color:#fff"><div class="step">80</div><div class="hex">48660E</div></div>
    <div class="swatch" style="background:#3C5611;color:#fff"><div class="step">90</div><div class="hex">3C5611</div></div>
    <div class="swatch" style="background:#2B3D0C;color:#fff"><div class="step">95</div><div class="hex">2B3D0C</div></div>
  </div>
</body></html>
