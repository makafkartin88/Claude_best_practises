<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--white); font-family: var(--font-sans); }
  .title { font: 700 11px/1 var(--font-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 70px 60px 1fr; gap: 12px; align-items: center; padding: 6px 0; }
  .name { font: 500 12px/1 var(--font-mono); color: var(--fg); }
  .val { font: 400 11px/1 var(--font-mono); color: var(--fg-subtle); }
  .bar { height: 14px; background: var(--brand); border-radius: 3px; }
</style></head>
<body>
  <div class="title">Spacing · 8‑point grid</div>
  <div class="row"><span class="name">--s-1</span><span class="val">4 px</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="name">--s-2</span><span class="val">8 px</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="name">--s-3</span><span class="val">12 px</span><span class="bar" style="width:12px"></span></div>
  <div class="row"><span class="name">--s-4</span><span class="val">16 px</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="name">--s-6</span><span class="val">24 px</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="name">--s-8</span><span class="val">32 px</span><span class="bar" style="width:32px"></span></div>
  <div class="row"><span class="name">--s-12</span><span class="val">48 px</span><span class="bar" style="width:48px"></span></div>
  <div class="row"><span class="name">--s-16</span><span class="val">64 px</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="name">--s-24</span><span class="val">96 px</span><span class="bar" style="width:96px"></span></div>
</body></html>
