<!doctype html>
<html><head><meta charset="utf-8"><title>Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-20); }
  .hero { font: 700 96px/0.95 var(--font-display); letter-spacing: -0.025em; color: var(--fg); margin: 0; }
  .hero em { font-style: normal; color: var(--brand); }
  .meta { font: 400 11px/1 var(--font-mono); color: var(--fg-subtle); margin-top: 12px; display: flex; gap: 20px; }
</style></head>
<body>
  <h1 class="hero">Data‑led strategy.<br><em>Intelligent automation.</em></h1>
  <div class="meta"><span>Host Grotesk · Bold (700)</span><span>96 / 91 · tracking -0.025em</span></div>
</body></html>
