<!doctype html>
<html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  body { margin: 0; padding: 24px; background: var(--white); font-family: var(--font-sans); }
  .title { font: 700 11px/1 var(--font-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 4px; }
  .sub { font: 400 12px/1.3 var(--font-sans); color: var(--fg-muted); margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; margin-bottom: 16px; }
  .cell { aspect-ratio: 1; border: 1px solid var(--bg-40); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--fg); }
  .cell i { font-size: 24px; }
  .cell span { font: 400 9px/1 var(--font-mono); color: var(--fg-subtle); }
  .stroke-row { display: flex; gap: 24px; align-items: center; margin-top: 8px; }
  .stroke-row i { font-size: 28px; color: var(--fg); }
  .stroke-lbl { font: 400 10px/1 var(--font-mono); color: var(--fg-subtle); margin-top: 6px; }
</style></head>
<body>
  <div class="title">Phosphor Icons · Regular (brand default)</div>
  <div class="sub">Primary library · monochrome · brand‑green / neutral / black / white only</div>
  <div class="grid">
    <div class="cell"><i class="ph ph-truck"></i><span>truck</span></div>
    <div class="cell"><i class="ph ph-chart-line-up"></i><span>chart</span></div>
    <div class="cell"><i class="ph ph-package"></i><span>package</span></div>
    <div class="cell"><i class="ph ph-tag"></i><span>tag</span></div>
    <div class="cell"><i class="ph ph-warehouse"></i><span>warehouse</span></div>
    <div class="cell"><i class="ph ph-currency-circle-dollar"></i><span>currency</span></div>
    <div class="cell"><i class="ph ph-cube"></i><span>cube</span></div>
    <div class="cell"><i class="ph ph-shopping-cart"></i><span>cart</span></div>
    <div class="cell"><i class="ph ph-trend-up"></i><span>trend</span></div>
    <div class="cell"><i class="ph ph-calendar-blank"></i><span>calendar</span></div>
  </div>
  <div class="stroke-row">
    <div style="text-align:center"><i class="ph-thin ph-package" style="font-size:28px"></i><div class="stroke-lbl">thin</div></div>
    <div style="text-align:center"><i class="ph-light ph-package" style="font-size:28px"></i><div class="stroke-lbl">light</div></div>
    <div style="text-align:center"><i class="ph ph-package" style="font-size:28px"></i><div class="stroke-lbl">regular ★</div></div>
    <div style="text-align:center"><i class="ph-bold ph-package" style="font-size:28px"></i><div class="stroke-lbl">bold</div></div>
    <div style="text-align:center"><i class="ph-fill ph-package" style="font-size:28px"></i><div class="stroke-lbl">fill</div></div>
  </div>
</body></html>
