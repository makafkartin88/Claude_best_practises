<!doctype html>
<html><head><meta charset="utf-8"><title>Numbers</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg-20); display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; align-items: end; }
  .stat { display: flex; flex-direction: column; gap: 8px; }
  .n { font: 700 88px/0.9 var(--font-display); letter-spacing: -0.03em; color: var(--fg); font-feature-settings: "tnum" 1; }
  .n.green { color: var(--brand); }
  .lbl { font: 400 13px/1.35 var(--font-sans); color: var(--fg-muted); max-width: 140px; }
</style></head>
<body>
  <div class="stat"><div class="n">2004</div><div class="lbl">On the market for two decades</div></div>
  <div class="stat"><div class="n">180</div><div class="lbl">Over 180 supply chain experts</div></div>
  <div class="stat"><div class="n green">1.000+</div><div class="lbl">More than 1,000 completed projects</div></div>
  <div class="stat"><div class="n">∞</div><div class="lbl">Countless ideas with added value</div></div>
</body></html>
