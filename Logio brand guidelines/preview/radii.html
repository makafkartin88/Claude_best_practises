<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--white); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 80px; background: var(--bg-20); border: 1.5px solid var(--brand); }
  .name { font: 500 11px/1 var(--font-mono); color: var(--fg); }
  .val { font: 400 10px/1 var(--font-mono); color: var(--fg-subtle); }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="box" style="border-radius:6px"></div><span class="name">xs</span><span class="val">6</span></div>
    <div class="cell"><div class="box" style="border-radius:8px"></div><span class="name">sm</span><span class="val">8</span></div>
    <div class="cell"><div class="box" style="border-radius:10px"></div><span class="name">md</span><span class="val">10</span></div>
    <div class="cell"><div class="box" style="border-radius:12px"></div><span class="name">lg</span><span class="val">12</span></div>
    <div class="cell"><div class="box" style="border-radius:16px"></div><span class="name">xl</span><span class="val">16</span></div>
    <div class="cell"><div class="box" style="border-radius:999px"></div><span class="name">pill</span><span class="val">∞</span></div>
  </div>
</body></html>
