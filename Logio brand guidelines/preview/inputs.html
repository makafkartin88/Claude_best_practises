<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
  body { margin: 0; padding: 28px; background: var(--white); font-family: var(--font-sans); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font: 500 12px/1 var(--font-sans); color: var(--fg); }
  .wrap { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--bg-40); border-radius: 10px; padding: 10px 14px; background: var(--white); transition: border-color var(--t-fast); }
  .wrap:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring); }
  .wrap input { border: 0; outline: none; font: 400 14px/1 var(--font-sans); flex: 1; color: var(--fg); background: transparent; }
  .wrap i { color: var(--fg-subtle); font-size: 18px; }
  .wrap.error { border-color: var(--danger); }
  .hint { font: 400 11px/1.3 var(--font-sans); color: var(--fg-subtle); }
  .hint.err { color: var(--danger); }
  .disabled { background: var(--bg-20); opacity: 0.7; }
</style></head>
<body>
  <div class="field">
    <span class="lbl">Company email</span>
    <label class="wrap"><i class="ph ph-envelope"></i><input value="sales@logio.com"></label>
    <span class="hint">We reply within one business day.</span>
  </div>
  <div class="field">
    <span class="lbl">Focus state</span>
    <label class="wrap" style="border-color:var(--brand);box-shadow:0 0 0 3px var(--focus-ring)"><i class="ph ph-magnifying-glass"></i><input value="Demand forecast"></label>
    <span class="hint">Type to search the Veritico catalogue.</span>
  </div>
  <div class="field">
    <span class="lbl">Error</span>
    <label class="wrap error"><i class="ph ph-warning-circle" style="color:var(--danger)"></i><input value="not-an-email"></label>
    <span class="hint err">Please enter a valid work email.</span>
  </div>
  <div class="field">
    <span class="lbl">Disabled</span>
    <label class="wrap disabled"><i class="ph ph-lock"></i><input disabled value="Read‑only value"></label>
    <span class="hint">Provisioned by your admin.</span>
  </div>
</body></html>
